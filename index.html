<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18284f">
  <title>Артур Петросян — визитка</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: #f4f2ea;
    }

    body {
      margin: 0;
      color: #f8f8ff;
      font: 16px/1.4 Arial, Helvetica, sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #ffc48d; outline-offset: 5px; }

    .cover {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding-inline: max(5vw, calc((100% - 1320px) / 2));
      background:
        radial-gradient(ellipse at 80% 43%, #424881 0, transparent 46%),
        linear-gradient(118deg, #101b34, #1a2d58 55%, #263879);
    }

    .bar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 14px;
    }

    header.bar { border-bottom: 1px solid #ffffff36; }
    nav.bar { border-top: 1px solid #ffffff36; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
    }

    .mark { color: #dbceff; font: 24px/1 Georgia, serif; }
    .link:hover { text-decoration: underline; text-underline-offset: 5px; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, .96fr) minmax(0, 1.04fr);
      align-items: center;
      gap: clamp(24px, 6vw, 90px);
      padding-block: clamp(28px, 6vh, 76px);
    }

    .portrait {
      margin: 0;
      padding: 2px;
      border-radius: 5px 36px 5px 36px;
      background: linear-gradient(
        145deg, #fff 0%, #acbdda 29%, #778aa8 45%,
        #f6e3ff 63%, #bfd2ec 82%, #fff 100%
      );
      box-shadow: 0 18px 48px #09132955;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: clamp(310px, 61vh, 700px);
      height: clamp(310px, 61svh, 700px);
      object-fit: cover;
      object-position: 31% 46%;
      border-radius: 3px 34px 3px 34px;
      background: #352923;
    }

    .intro { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(54px, 8vw, 128px);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 500;
    }

    h1 em {
      display: block;
      color: #e9e6ff;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
    }

    .role {
      margin: clamp(18px, 3vw, 38px) 0 0;
      font-size: clamp(17px, 2vw, 28px);
      letter-spacing: -.025em;
    }

    .place { margin: 5px 0 0; color: #cad5ed; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 18px;
      border: 1px solid #c0cadc;
      border-radius: 24px;
      background: linear-gradient(174deg, #fff, #e7ecf6 55%, #ced8eb);
      box-shadow: inset 0 1px 0 white;
      color: #192b53;
      font-weight: 600;
    }

    .button:hover { background: #fff; }

    .original {
      height: 100vh;
      height: 100dvh;
      padding-top: 2px;
      background: linear-gradient(90deg, #aab7cf, #f9f5ff, #9caecc);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f2ea;
    }

    @media (max-width: 650px) {
      .cover { padding-inline: 4vw; }
      .bar { min-height: 60px; }

      .hero {
        grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
        gap: 3vw;
        padding-block: 25px;
      }

      .portrait { border-radius: 4px 20px 4px 20px; }

      .portrait img {
        height: clamp(220px, 61vw, 365px);
        object-position: 41% center;
        border-radius: 2px 18px 2px 18px;
      }

      h1 { font-size: clamp(27px, 7.25vw, 48px); }
      .role { margin-top: 16px; font-size: 16px; line-height: 1.25; }
      .place { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

<body>
  <main>
    <section class="cover" id="top" aria-labelledby="name">
      <header class="bar">
        <a class="brand" href="#top">
          <span class="mark" aria-hidden="true">♠</span>
          А. Петросян
        </a>
        <a class="link" href="preview (5)(1)(1).html#contacts"
           target="original-site" data-section>Контакты ↓</a>
      </header>

      <div class="hero">
        <figure class="portrait">
          <img src="image(9).png"
               alt="Артур Петросян в профиль, в очках"
               fetchpriority="high">
        </figure>

        <div class="intro">
          <h1 id="name">Артур <em>Петросян</em></h1>
          <p class="role">Студент-стоматолог, 2 курс</p>
          <p class="place">КубГМУ · Краснодар</p>
        </div>
      </div>

      <nav class="bar" aria-label="Быстрые действия">
        <a class="link" href="preview (5)(1)(1).html#card"
           target="original-site" data-section>К визитке ↓</a>
        <a class="button" download="Артур-Петросян.vcf"
           id="save-contact" href="artur-student.vcf">Сохранить контакт</a>
      </nav>
    </section>

    <section class="original" id="site" aria-label="Визитка и контакты">
      <iframe name="original-site"
              src="preview (5)(1)(1).html#card"
              title="Визитка и контакты Артура Петросяна"></iframe>
    </section>
  </main>

  <script>
    const originalSection = document.getElementById("site");

    for (const link of document.querySelectorAll("[data-section]")) {
      link.addEventListener("click", () => {
        originalSection.scrollIntoView({ block: "start" });
      });
    }

    const contact = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:Петросян;Артур;;;",
      "FN:Артур Петросян",
      "ORG:КубГМУ",
      "TITLE:Студент-стоматолог",
      "TEL;TYPE=CELL:+79180223200",
      "URL:https://t.me/+79180223200",
      "END:VCARD",
      ""
    ].join("\r\n");

    const contactFile = new Blob([contact], { type: "text/vcard;charset=utf-8" });
    document.getElementById("save-contact").href = URL.createObjectURL(contactFile);
  </script>
</body>
</html>
